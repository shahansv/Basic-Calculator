<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Calculator</title>
    <link rel="shortcut icon" href="./assets/favicon.png" type="image/x-icon" />
    <!-- BOOTSTRAP -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- FONT AWESOME PRO -->
    <link
      rel="stylesheet"
      href="https://site-assets.fontawesome.com/releases/v7.0.0/css/all.css"
    />

    <!-- GOOGLE FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body
    class="vh-100 d-flex justify-content-center align-items-center text-light"
  >
    <div id="calculator" class="rounded-4 container">
      <div
        class="h-25 d-flex justify-content-center align-items-center px-3 py-4"
      >
        <input
          type="number"
          class="w-100 h-100 rounded-4 p-4 fs-2 mt-3 bg-success-subtle border-0 focus-ring focus-ring-dark"
        />
      </div>
      <div class="h-75 p-4">
        <div class="h-100 row">
          <div class="col-3 d-flex justify-content-center align-items-center">
            <button class="rounded-4 key btn btn-dark fs-5">7</button>
          </div>

          <div class="col-3 d-flex justify-content-center align-items-center">
            <button class="rounded-4 key btn btn-dark fs-5">8</button>
          </div>

          <div class="col-3 d-flex justify-content-center align-items-center">
            <button class="rounded-4 key btn btn-dark fs-5">9</button>
          </div>

          <div class="col-3 d-flex justify-content-center align-items-center">
            <button class="rounded-4 key btn btn-dark fs-5">x</button>
          </div>

          <div class="col-3 d-flex justify-content-center align-items-center">
            <button class="rounded-4 key btn btn-dark fs-5">4</button>
          </div>

          <div class="col-3 d-flex justify-content-center align-items-center">
            <button class="rounded-4 key btn btn-dark fs-5">5</button>
          </div>

          <div class="col-3 d-flex justify-content-center align-items-center">
            <button class="rounded-4 key btn btn-dark fs-5">6</button>
          </div>

          <div class="col-3 d-flex justify-content-center align-items-center">
            <button class="rounded-4 key btn btn-dark fs-5">-</button>
          </div>

          <div class="col-3 d-flex justify-content-center align-items-center">
            <button class="rounded-4 key btn btn-dark fs-5">1</button>
          </div>

          <div class="col-3 d-flex justify-content-center align-items-center">
            <button class="rounded-4 key btn btn-dark fs-5">2</button>
          </div>

          <div class="col-3 d-flex justify-content-center align-items-center">
            <button class="rounded-4 key btn btn-dark fs-5">3</button>
          </div>

          <div class="col-3 d-flex justify-content-center align-items-center">
            <button class="rounded-4 key btn btn-dark fs-5">+</button>
          </div>

          <div
            class="col-9 d-flex justify-content-center align-items-center p-1"
          >
            <button class="rounded-4 key btn btn-dark fs-5 w-100">0</button>
          </div>

          <div class="col-3 d-flex justify-content-center align-items-center">
            <button class="rounded-4 key btn btn-dark fs-5">&divide;</button>
          </div>

          <div
            class="col-4 d-flex justify-content-center align-items-center p-1"
          >
            <button class="rounded-4 key btn btn-dark fs-5 w-100">
              <i class="fa-regular fa-delete-left"></i>
            </button>
          </div>

          <div
            class="col-4 d-flex justify-content-center align-items-center p-1"
          >
            <button class="rounded-4 key btn btn-dark fs-5 w-100">AC</button>
          </div>

          <div
            class="col-4 d-flex justify-content-center align-items-center p-1"
          >
            <button id="equalBtn" class="rounded-4 key btn fs-5 fw-bold w-100">
              =
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
